<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EspressoManager - Đặt bàn</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary-container": "#4e342e",
                "on-error-container": "#93000a",
                "inverse-surface": "#30312e",
                "tertiary-fixed-dim": "#f0bd8b",
                "primary-fixed": "#ffdad2",
                "on-tertiary-fixed": "#2c1600",
                "tertiary": "#391e00",
                "surface-container-highest": "#e4e2de",
                "on-tertiary-container": "#cb9b6c",
                "on-surface": "#1b1c1a",
                "error": "#ba1a1a",
                "secondary-fixed": "#a3f69c",
                "inverse-primary": "#e5beb5",
                "surface-variant": "#e4e2de",
                "on-secondary": "#ffffff",
                "surface-container": "#efeeea",
                "outline": "#827471",
                "on-primary-fixed-variant": "#5c403a",
                "surface-container-high": "#eae8e4",
                "on-primary-container": "#c19c94",
                "background": "#fbf9f5",
                "on-background": "#1b1c1a",
                "tertiary-container": "#54330c",
                "on-secondary-fixed-variant": "#005312",
                "outline-variant": "#d4c3bf",
                "surface": "#fbf9f5",
                "on-secondary-container": "#217128",
                "on-error": "#ffffff",
                "on-secondary-fixed": "#002204",
                "on-primary-fixed": "#2b1611",
                "surface-tint": "#755750",
                "surface-dim": "#dbdad6",
                "secondary": "#1b6d24",
                "on-primary": "#ffffff",
                "secondary-fixed-dim": "#88d982",
                "on-surface-variant": "#504442",
                "surface-container-low": "#f5f3ef",
                "secondary-container": "#a0f399",
                "primary": "#361f1a",
                "surface-container-lowest": "#ffffff",
                "on-tertiary-fixed-variant": "#623f18",
                "error-container": "#ffdad6"
              },
              fontFamily: {
                "headline": ["Manrope"],
                "body": ["Work Sans"],
                "label": ["Work Sans"]
              },
              borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Work Sans', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-stone-100 flex items-center justify-center min-h-screen p-4">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50">
<!-- Book Table Dialog Container -->
<div class="bg-background w-full max-w-2xl rounded-xl shadow-2xl overflow-hidden border border-outline-variant">
<!-- Header -->
<div class="flex items-center justify-between px-6 py-4 bg-[#FDFBF7] border-b border-stone-200">
<h1 class="text-xl font-bold text-primary-container tracking-tight">Đặt bàn</h1>
<button class="p-2 hover:bg-stone-100 rounded-full transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
<div class="p-6 space-y-6">
<!-- Row 1: Dropdowns -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-primary px-1">Chọn Tầng</label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 appearance-none focus:ring-2 focus:ring-primary-container focus:outline-none text-on-surface">
<option>Tầng trệt (Ground Floor)</option>
<option>Tầng 1 (Lầu 1)</option>
<option>Sân thượng (Rooftop)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-primary px-1">Số người</label>
<div class="relative">
<select class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-4 py-2.5 appearance-none focus:ring-2 focus:ring-primary-container focus:outline-none text-on-surface">
<option>1 người</option>
<option selected="">2 người</option>
<option>4 người</option>
<option>6 người</option>
<option>8+ người</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-2.5 pointer-events-none text-on-surface-variant">groups</span>
</div>
</div>
</div>
<!-- Row 2: Table Selection Grid -->
<div class="space-y-3">
<label class="text-sm font-semibold text-primary px-1">Danh sách bàn trống</label>
<div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3">
<button class="flex flex-col items-center justify-center p-3 rounded-xl border-2 border-primary-container bg-surface-container-highest text-primary-container font-bold">
<span class="text-xs uppercase opacity-70">Table</span>
<span class="text-lg">01</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl border border-outline-variant bg-white hover:border-primary-container transition-all text-on-surface-variant">
<span class="text-xs uppercase opacity-70">Table</span>
<span class="text-lg">02</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl border border-outline-variant bg-white hover:border-primary-container transition-all text-on-surface-variant">
<span class="text-xs uppercase opacity-70">Table</span>
<span class="text-lg">03</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl border border-outline-variant bg-white hover:border-primary-container transition-all text-on-surface-variant">
<span class="text-xs uppercase opacity-70">Table</span>
<span class="text-lg">04</span>
</button>
<button class="flex flex-col items-center justify-center p-3 rounded-xl border border-outline-variant bg-stone-100 opacity-50 cursor-not-allowed">
<span class="text-xs uppercase opacity-70">Table</span>
<span class="text-lg">05</span>
</button>
</div>
</div>
<!-- Row 3: Time Selection -->
<div class="space-y-3">
<h3 class="text-sm font-bold text-primary-container flex items-center gap-2">
<span class="material-symbols-outlined text-lg">schedule</span>
                        Thời gian đặt bàn
                    </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-xs font-medium text-on-surface-variant px-1">Ngày đặt</label>
<input class="w-full bg-white border border-outline-variant rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary-container text-on-surface" type="date" value="2023-11-20"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs font-medium text-on-surface-variant px-1">Giờ đặt</label>
<input class="w-full bg-white border border-outline-variant rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary-container text-on-surface" type="time" value="18:30"/>
</div>
</div>
</div>
<!-- Row 4: Customer Info -->
<div class="space-y-3">
<h3 class="text-sm font-bold text-primary-container flex items-center gap-2">
<span class="material-symbols-outlined text-lg">person</span>
                        Thông tin khách hàng
                    </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-xs font-medium text-on-surface-variant px-1">Tên khách hàng</label>
<input class="w-full bg-white border border-outline-variant rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary-container text-on-surface" placeholder="Nhập tên khách..." type="text"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs font-medium text-on-surface-variant px-1">Số điện thoại</label>
<input class="w-full bg-white border border-outline-variant rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary-container text-on-surface" placeholder="0xxx xxx xxx" type="tel"/>
</div>
</div>
</div>
<!-- Row 5: Notes -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-primary px-1">Ghi chú</label>
<textarea class="w-full bg-white border border-outline-variant rounded-lg px-4 py-2 focus:ring-2 focus:ring-primary-container text-on-surface resize-none" placeholder="Yêu cầu đặc biệt (ví dụ: trang trí sinh nhật, ghế trẻ em...)" rows="3"></textarea>
</div>
<!-- Row 6: Deposit Switch -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-xl border border-outline-variant">
<div class="flex items-center gap-3">
<div class="bg-primary-container/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary-container">payments</span>
</div>
<div>
<p class="font-bold text-primary-container leading-tight">Đặt cọc</p>
<p class="text-xs text-on-surface-variant">Áp dụng cho đoàn khách đông hoặc giờ cao điểm</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-stone-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
</label>
</div>
</div>
<!-- Footer -->
<div class="flex items-center justify-between px-6 py-4 bg-stone-50 border-t border-stone-200">
<button class="flex items-center gap-2 px-5 py-2.5 text-on-surface-variant font-semibold hover:bg-stone-200 rounded-lg transition-colors">
<span class="material-symbols-outlined text-lg">close</span>
                    Đóng
                </button>
<button class="flex items-center gap-2 px-8 py-2.5 bg-primary-container text-white font-bold rounded-lg shadow-lg shadow-primary-container/20 hover:brightness-110 active:scale-95 transition-all">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    Cập nhật
                </button>
</div>
</div>
</div>
</body></html>
