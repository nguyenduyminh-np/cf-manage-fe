<body class="bg-coffee-texture min-h-screen flex flex-col font-body text-on-surface overflow-x-hidden">
<!-- Header (Suppressed Nav - Simplified Brand Only as per focus rule) -->
<header class="w-full flex justify-between items-center px-6 py-6 absolute top-0 z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container text-3xl" data-icon="coffee">coffee</span>
<span class="font-headline font-extrabold text-2xl text-primary-container tracking-tight">Caffè Harmony</span>
</div>
</header>
<!-- Main Registration Section -->
<main class="flex-grow flex items-center justify-center p-6 mt-12 mb-12">
<div class="w-full max-w-lg bg-surface-container-lowest/90 backdrop-blur-md rounded-xl shadow-xl p-8 md:p-12 border border-outline-variant">
<!-- Form Header -->
<div class="text-center mb-10">
<h1 class="font-headline font-extrabold text-3xl text-primary-container mb-2">Artisan Roast Admin</h1>
<p class="text-on-surface-variant font-medium">Bắt đầu quản lý không gian cafe của bạn</p>
</div>
<!-- Registration Form -->
<form action="#" class="space-y-5">
<!-- Email Field -->
<div class="space-y-1.5">
<label class="text-sm font-semibold text-on-surface-variant block" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl" data-icon="mail">mail</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-transparent outline-none transition-all placeholder:text-outline-variant text-on-surface" id="email" name="email" placeholder="example@harmony.com" type="email"/>
</div>
</div>
<!-- Username Field -->
<div class="space-y-1.5">
<label class="text-sm font-semibold text-on-surface-variant block" for="username">Tên đăng nhập</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl" data-icon="person">person</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-transparent outline-none transition-all placeholder:text-outline-variant text-on-surface" id="username" name="username" placeholder="roastmaster_01" type="text"/>
</div>
</div>
<!-- Date of Birth Field -->
<div class="space-y-1.5">
<label class="text-sm font-semibold text-on-surface-variant block" for="dob">Ngày sinh</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl" data-icon="calendar_today">calendar_today</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-transparent outline-none transition-all text-on-surface" id="dob" name="dob" type="date"/>
</div>
</div>
<!-- Password Fields Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="text-sm font-semibold text-on-surface-variant block" for="password">Mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl" data-icon="lock">lock</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-transparent outline-none transition-all placeholder:text-outline-variant text-on-surface" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="space-y-1.5">
<label class="text-sm font-semibold text-on-surface-variant block" for="confirm_password">Nhập lại mật khẩu</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl" data-icon="lock_reset">lock_reset</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary-container focus:border-transparent outline-none transition-all placeholder:text-outline-variant text-on-surface" id="confirm_password" name="confirm_password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Register Button -->
<div class="pt-4">
<button class="w-full bg-primary-container text-on-primary py-4 rounded-xl font-headline font-bold text-lg hover:bg-primary transition-colors flex items-center justify-center gap-2 group" type="submit">
                        Đăng ký
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant font-medium">
                    Bạn đã có tài khoản? 
                    <a class="text-primary-container font-bold hover:underline decoration-2 underline-offset-4 transition-all" href="#">Đăng nhập!</a>
</p>
</div>
</div>
</main>
<!-- Decoration Element: Coffee Beans Background Blur -->
<div class="fixed bottom-0 left-0 w-64 h-64 -mb-32 -ml-32 bg-primary-container/10 rounded-full blur-3xl -z-10"></div>
<div class="fixed top-0 right-0 w-96 h-96 -mt-48 -mr-48 bg-secondary-container/20 rounded-full blur-3xl -z-10"></div>
<!-- Footer Component from JSON Mapping -->
<footer class="w-full py-8 px-6 flex flex-col items-center gap-4 bg-[#FDFBF7] dark:bg-stone-950 border-t border-stone-200 dark:border-stone-800">
<div class="flex items-center gap-2 mb-2">
<span class="font-manrope font-semibold text-[#4E342E] text-lg">Caffè Harmony</span>
</div>
<div class="flex flex-wrap justify-center gap-6 mb-4">
<a class="font-workSans text-sm text-stone-500 hover:text-[#2E7D32] transition-colors" href="#">Privacy Policy</a>
<a class="font-workSans text-sm text-stone-500 hover:text-[#2E7D32] transition-colors" href="#">Terms of Service</a>
<a class="font-workSans text-sm text-stone-500 hover:text-[#2E7D32] transition-colors" href="#">Contact Us</a>
</div>
<p class="font-workSans text-sm text-stone-500">© 2024 Caffè Harmony. All rights reserved.</p>
</footer>
</body></html>
