<header class="admin-header">
  <div class="search-well">
    <span class="material-symbols-outlined icon">search</span>
    <input type="text" placeholder="Search invoices, customers, ingredients..." />
  </div>

  <div class="header-actions">
    <div class="action-buttons">
      <button class="btn-icon notify-btn">
        <span class="material-symbols-outlined">notifications</span>
        <span class="badge"></span>
      </button>
      <button class="btn-icon">
        <span class="material-symbols-outlined">settings</span>
      </button>
    </div>

    <div class="divider"></div>

    <button class="profile-trigger">
      <img
        src="https://ui-avatars.com/api/?name=Admin+User&background=33210d&color=fff"
        alt="Admin Profile"
      />
      <div class="profile-info">
        <p class="name">Admin User</p>
        <p class="role">Store Manager</p>
      </div>
      <span class="material-symbols-outlined expand-icon">expand_more</span>
    </button>
  </div>
</header>
