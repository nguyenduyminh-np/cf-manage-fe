<header class="admin-header" [class.admin-header--sidebar-collapsed]="sidebarCollapsed()">
  <button class="search-well" (click)="openSearch()">
    <div class="search-trigger-content">
      <span class="material-symbols-outlined icon">search</span>
      <span class="placeholder-text">Tìm kiếm nhanh</span>
    </div>
    <span class="shortcut-badge">Ctrl K</span>
  </button>

  <div class="header-actions">
    <div class="action-buttons">
      <app-notification-bell />
      <button class="btn-icon">
        <span class="material-symbols-outlined">settings</span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="profile-menu-wrap" (click)="$event.stopPropagation()">
      <button
        class="profile-trigger"
        type="button"
        (click)="toggleProfileMenu($event)"
        [attr.aria-expanded]="isProfileMenuOpen"
        aria-haspopup="menu"
      >
        <img
          [src]="'https://ui-avatars.com/api/?name=' + userName + '&background=33210d&color=fff'"
          [alt]="userName + ' Profile'"
        />
        <div class="profile-info">
          <p class="name">{{ userName }}</p>
          <p class="role">{{ userRole }}</p>
        </div>
        <span class="material-symbols-outlined expand-icon">expand_more</span>
      </button>

      @if (isProfileMenuOpen) {
        <div class="profile-dropdown" role="menu">
          <a class="menu-item" role="menuitem" routerLink="/user-profile" (click)="closeProfileMenu()">
            <span class="material-symbols-outlined">account_circle</span>
            <span>Quản lý Profile</span>
          </a>
          <a class="menu-item logout" role="menuitem" href="#" (click)="onLogout($event)">
            <span class="material-symbols-outlined">logout</span>
            <span>Đăng xuất</span>
          </a>
        </div>
      }
    </div>
  </div>
</header>
