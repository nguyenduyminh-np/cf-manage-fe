<div class="df-dialog">
  <!-- Header -->
  <header class="df-dialog__header">
    <h2 class="df-dialog__title">{{ isEdit ? 'Chỉnh sửa món ăn' : 'Thêm món mới' }}</h2>
    <button type="button" class="df-dialog__close" (click)="cancel()" aria-label="Close dialog">
      <span class="material-symbols-outlined">close</span>
    </button>
  </header>

  <form class="df-dialog__form" (ngSubmit)="submit()">
    <!-- Body -->
    <div class="df-dialog__body">
      <!-- Image Upload Area -->
      <div class="df-photo-section">
        <label class="df-field__label"
          >Ảnh mô tả <span class="df-field__opt">(tuỳ chọn)</span></label
        >

        <div class="df-photo">
          @if (photoPreview()) {
            <div class="df-photo__preview">
              <img [src]="photoPreview()" alt="Ảnh món ăn" class="df-photo__img" />
              <button type="button" class="df-photo__clear" (click)="clearPhoto()" title="Xoá ảnh">
                <span class="material-symbols-outlined">close</span>
              </button>
            </div>
          } @else {
            <label class="df-photo__upload-area" for="df-photo-file">
              <span class="material-symbols-outlined df-photo__upload-icon"
                >add_photo_alternate</span
              >
              <span class="df-photo__upload-text">Kéo thả hoặc nhấn để tải ảnh</span>
              <input
                id="df-photo-file"
                type="file"
                accept="image/*"
                class="df-photo__file-input"
                (change)="onFileSelected($event)"
              />
            </label>
          }
        </div>

        <div class="df-photo__url">
          <span class="df-photo__divider">hoặc nhập URL</span>
          <input
            class="df-field__input df-photo__url-input"
            name="photo"
            type="text"
            [(ngModel)]="formData.photo"
            (ngModelChange)="onPhotoUrlChange()"
            placeholder="https://..."
            autocomplete="off"
          />
        </div>
      </div>

      <!-- Input Fields -->
      <div class="df-fields-section">
        <div class="df-row">
          <label class="df-field">
            <span class="df-field__label">Mã món</span>
            <input
              class="df-field__input"
              name="dishCode"
              type="text"
              [(ngModel)]="formData.dishCode"
              placeholder="VD: CF-01"
              autocomplete="off"
            />
          </label>
          <label class="df-field">
            <span class="df-field__label"
              >Danh mục món ăn <span class="df-field__req">*</span></span
            >
            @if (catLoading()) {
              <div class="df-field__skeleton">Đang tải...</div>
            } @else {
              <app-ui-select
                name="dishCategoryId"
                [value]="formData.dishCategoryId"
                (valueChange)="onCategoryChange($event)"
                [options]="categoryOptions"
                placeholder="Chọn danh mục"
                ariaLabel="Danh mục món ăn"
                [required]="true"
              />
            }
          </label>
        </div>

        <label class="df-field">
          <span class="df-field__label">Tên món <span class="df-field__req">*</span></span>
          <input
            class="df-field__input"
            name="dishName"
            type="text"
            [(ngModel)]="formData.dishName"
            placeholder="Nhập tên món ăn"
            autocomplete="off"
            required
          />
        </label>

        <label class="df-field">
          <span class="df-field__label">Giá <span class="df-field__req">*</span></span>
          <div class="df-field__input-wrapper">
            <input
              class="df-field__input df-field__input--price"
              name="price"
              type="number"
              min="0"
              [(ngModel)]="formData.price"
              placeholder="0"
              required
            />
            <span class="df-field__suffix">đ</span>
          </div>
        </label>

        @if (isEdit) {
          <div class="df-field">
            <span class="df-field__label">Trạng thái</span>
            <label class="df-toggle" [class.df-toggle--on]="formData.active">
              <input
                type="checkbox"
                name="active"
                [(ngModel)]="formData.active"
                class="df-toggle__input"
              />
              <span class="df-toggle__track"><span class="df-toggle__thumb"></span></span>
              <span class="df-toggle__text">{{
                formData.active ? 'Đang hoạt động' : 'Ngừng hoạt động'
              }}</span>
            </label>
          </div>
        }
      </div>
    </div>

    <!-- Footer buttons -->
    <footer class="df-dialog__footer">
      <button tuiButton type="button" class="btn btn--ghost" (click)="cancel()">Hủy</button>
      <button tuiButton type="submit" class="btn btn--primary" [disabled]="!isValid">
        {{ isEdit ? 'Lưu thay đổi' : 'Lưu món ăn' }}
      </button>
    </footer>
  </form>
</div>
