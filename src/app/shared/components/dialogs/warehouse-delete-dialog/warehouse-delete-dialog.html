<div class="sd-dialog">
  <header class="sd-dialog__header">
    <span class="material-symbols-outlined sd-dialog__icon">warning</span>
    <h2 class="sd-dialog__title">Xác nhận xóa nhà kho</h2>
  </header>

  <div class="sd-dialog__body">
    <p class="sd-dialog__message">
      Bạn có chắc chắn muốn xóa nhà kho
      <strong class="sd-dialog__name">{{ warehouse.warehouseName }}</strong>?
    </p>
    <p class="sd-dialog__note">
      Thao tác này sẽ vô hiệu hóa nhà kho (ngừng hoạt động). Yêu cầu nhà kho không có tồn kho hoặc giao dịch đang xử lý.
    </p>
  </div>

  <footer class="sd-dialog__footer">
    <button tuiButton type="button" class="sd-btn sd-btn--ghost" (click)="cancel()">
      Hủy bỏ
    </button>
    <button tuiButton type="button" class="sd-btn sd-btn--danger" (click)="confirm()">
      <span class="material-symbols-outlined">delete</span>
      Xác nhận xóa
    </button>
  </footer>
</div>
