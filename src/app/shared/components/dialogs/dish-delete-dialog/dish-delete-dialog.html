<div class="dd-dialog">
  <div class="dd-dialog__icon-wrap" aria-hidden="true">
    <span class="material-symbols-outlined dd-dialog__icon">delete_forever</span>
  </div>
  <div class="dd-dialog__body">
    <h2 class="dd-dialog__title">Xóa món ăn</h2>
    <p class="dd-dialog__msg">
      Bạn có chắc chắn muốn xóa món <strong class="dd-dialog__name">{{ dishName }}</strong>?
      Món ăn sẽ bị ẩn khỏi thực đơn.
    </p>
  </div>
  <div class="dd-dialog__footer">
    <button tuiButton type="button" class="btn btn--ghost" (click)="cancel()">Hủy bỏ</button>
    <button tuiButton type="button" class="btn btn--danger" (click)="confirm()">
      <span class="material-symbols-outlined">delete</span> Xóa
    </button>
  </div>
</div>
