<div class="dd-dialog">
  <header class="dd-dialog__header">
    <span class="material-symbols-outlined dd-dialog__icon">warning</span>
    <h2 class="dd-dialog__title">Xác nhận xóa món ăn</h2>
  </header>

  <div class="dd-dialog__body">
    <p class="dd-dialog__message">
      Bạn có chắc chắn muốn xóa món ăn
      <strong class="dd-dialog__name">{{ dishName }}</strong>?
    </p>
    <p class="dd-dialog__note">
      Món ăn sẽ bị ẩn khỏi thực đơn. Dữ liệu liên quan sẽ không bị xóa vĩnh viễn.
    </p>
  </div>

  <footer class="dd-dialog__footer">
    <button tuiButton type="button" class="dd-btn dd-btn--ghost" (click)="cancel()">
      Hủy bỏ
    </button>
    <button tuiButton type="button" class="dd-btn dd-btn--danger" (click)="confirm()">
      <span class="material-symbols-outlined">delete</span>
      Xác nhận xóa
    </button>
  </footer>
</div>
