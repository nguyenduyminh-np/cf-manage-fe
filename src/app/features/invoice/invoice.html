<main class="invoice-page">
  <!-- Header -->
  <header class="invoice-page__header">
    <div>
      <h1 class="invoice-page__title">Quản lý hóa đơn</h1>
      <p class="invoice-page__subtitle">Quản lý và theo dõi các giao dịch thanh toán của quán.</p>
    </div>
    <div class="invoice-page__actions">
      <button tuiButton type="button" class="btn btn--ghost">
        <span class="material-symbols-outlined">download</span>
        Xuất file
      </button>
      <button tuiButton type="button" class="btn btn--primary" (click)="createInvoice()">
        <span class="material-symbols-outlined">add</span>
        Tạo mới
      </button>
    </div>
  </header>

  <!-- Dynamic Search Bar -->
  <section class="invoice-search" aria-label="Bộ lọc hóa đơn">
    <form (ngSubmit)="applySearch()">
      <div class="invoice-search__grid">
        <label class="invoice-search__field">
          <span>Mã hóa đơn</span>
          <input
            name="invoiceCode"
            type="text"
            [(ngModel)]="searchFilters.invoiceCode"
            (ngModelChange)="onFiltersChanged()"
            placeholder="Tìm mã..."
            autocomplete="off"
          />
        </label>

        <label class="invoice-search__field">
          <span>Trạng thái</span>
          <select
            name="paymentStatus"
            [(ngModel)]="searchFilters.paymentStatus"
            (ngModelChange)="onFiltersChanged()"
          >
            @for (opt of paymentStatusOptions; track opt.value) {
              <option [ngValue]="opt.value">{{ opt.label }}</option>
            }
          </select>
        </label>

        <label class="invoice-search__field">
          <span>Phương thức</span>
          <select
            name="paymentMethod"
            [(ngModel)]="searchFilters.paymentMethod"
            (ngModelChange)="onFiltersChanged()"
          >
            @for (opt of paymentMethodOptions; track opt.value) {
              <option [ngValue]="opt.value">{{ opt.label }}</option>
            }
          </select>
        </label>

        <label class="invoice-search__field">
          <span>Tổng tiền từ</span>
          <input
            name="totalAmountFrom"
            type="number"
            [(ngModel)]="searchFilters.totalAmountFrom"
            (ngModelChange)="onFiltersChanged()"
            placeholder="Từ"
            min="0"
          />
        </label>

        <label class="invoice-search__field">
          <span>đến</span>
          <input
            name="totalAmountTo"
            type="number"
            [(ngModel)]="searchFilters.totalAmountTo"
            (ngModelChange)="onFiltersChanged()"
            placeholder="Đến"
            min="0"
          />
        </label>
      </div>

      <div class="invoice-search__actions">
        <button tuiButton type="submit" class="btn btn--primary btn--small">
          <span class="material-symbols-outlined">search</span>
          Tìm kiếm
        </button>
        <button tuiButton type="button" class="btn btn--ghost btn--small" (click)="resetSearch()">
          <span class="material-symbols-outlined">refresh</span>
          Làm mới
        </button>
      </div>
    </form>
  </section>

  <!-- Data state (kết hợp async pipe) -->
  @if (detailState$ | async; as state) {
    <!-- Loading -->
    @if (state.isLoading) {
      <div class="invoice-loading" aria-live="polite">Đang tải danh sách hóa đơn...</div>
    }

    <!-- Error -->
    @if (state.error) {
      <div class="invoice-error" role="alert">{{ state.error }}</div>
    }

    <!-- AG Grid -->
    <div class="invoice-grid-wrap">
      <ag-grid-angular
        class="invoice-grid ag-theme-quartz"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [rowData]="state.rowData"
        [pagination]="false"
        [loading]="state.isLoading"
        [overlayLoadingTemplate]="'Đang tải dữ liệu...'"
        [overlayNoRowsTemplate]="'Không có hóa đơn nào'"
        [suppressCellFocus]="true"
        [headerHeight]="46"
        [rowHeight]="46"
        (gridReady)="onGridReady($event)"
        (cellClicked)="onCellClicked($event)"
        (rowDoubleClicked)="onRowDoubleClicked($event)"
      ></ag-grid-angular>
    </div>

    <!-- Pagination Footer -->
    <footer class="invoice-pagination">
      <div class="invoice-pagination__info">
        <p>Tổng số bản ghi: {{ state.totalElements }}</p>
        <label for="invoice-page-size">Hiển thị</label>
        <select
          id="invoice-page-size"
          [ngModel]="state.pageSize"
          (ngModelChange)="setPageSize($event)"
        >
          @for (size of pageSizeOptions; track size) {
            <option [ngValue]="size">{{ size }}</option>
          }
        </select>
        <span>bản ghi</span>
      </div>

      <div class="invoice-pagination__nav">
        <button
          tuiButton
          type="button"
          class="btn--ghost btn--icon"
          [disabled]="!canGoPrevious(state)"
          (click)="previousPage()"
          aria-label="Trang trước"
        >
          <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <span class="invoice-pagination__indicator">{{ pageSummary(state) }}</span>
        <button
          tuiButton
          type="button"
          class="btn--ghost btn--icon"
          [disabled]="!canGoNext(state)"
          (click)="nextPage()"
          aria-label="Trang sau"
        >
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>
    </footer>
  }
</main>
