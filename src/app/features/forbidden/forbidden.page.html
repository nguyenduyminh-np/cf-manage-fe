<div class="forbidden-page">
  <header class="forbidden-page__header" aria-label="Thương hiệu Caffe Harmony">
    <div class="forbidden-brand">
      <span class="material-symbols-outlined" aria-hidden="true">coffee</span>
      <span class="type-title-lg">Caffe Harmony</span>
    </div>
  </header>

  <main class="forbidden-page__main">
    <section class="forbidden-card" aria-label="Thông báo không có quyền truy cập">
      <div class="forbidden-card__icon">
        <span class="material-symbols-outlined">shield_lock</span>
      </div>
      <h1 class="type-headline-lg">Không có quyền truy cập</h1>
      <p class="type-body-md text-measure">
        Bạn không có quyền truy cập trang này. Vui lòng liên hệ quản trị viên nếu bạn cho rằng đây là lỗi.
      </p>
      <a
        tuiButton
        routerLink="/dashboard"
        class="forbidden-card__btn type-label-md"
      >
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
        <span>Về Dashboard</span>
      </a>
    </section>
  </main>

  <div class="forbidden-page__blur forbidden-page__blur--left" aria-hidden="true"></div>
  <div class="forbidden-page__blur forbidden-page__blur--right" aria-hidden="true"></div>
</div>
